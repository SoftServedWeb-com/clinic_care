[project]
name = "clinic_care"
authors = [
    { name = "Soft Served Web", email = "aswin@softservedweb.com"}
]
description = "A comprehensive Frappe application designed to streamline healthcare clinic operations. This system manages the entire patient journey from registration through treatment and follow-up care."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
